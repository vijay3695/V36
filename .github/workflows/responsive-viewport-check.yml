name: Responsive viewport checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "tests/e2e/manual-check.spec.js"
      - "playwright.config.js"
      - "package.json"
      - ".github/workflows/responsive-viewport-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}-chromium
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Ensure Chromium is installed
        run: npx playwright install chromium
      - name: Test responsive overflow at 320, 375, 768, and 1280 pixels
        run: npx playwright test tests/e2e/manual-check.spec.js -g "responsive no horizontal overflow"
