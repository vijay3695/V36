name: Publish v0.1.0

on:
  push:
    branches: [main]
    paths:
      - "docs/releases/v0.1.0.md"

permissions:
  contents: write

concurrency:
  group: publish-v0.1.0
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify candidate, then publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete release test suite
        run: npm run test:all
      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists; refusing to replace it."
            exit 1
          fi
          gh release create v0.1.0 \
            --target "$GITHUB_SHA" \
            --title "V36 v0.1.0 — Public Preview" \
            --notes-file docs/releases/v0.1.0.md
